spring.application.name=calendario-api

# Puerto de la API Calendario
server.port=${SERVER_PORT:8081}

# Base de datos PostgreSQL CalendarioLaboral (ya creada)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/calendariolaboral}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate no crea ni borra tablas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# API Festivos (Node.js + Express + MongoDB)
festivos.api.url=${FESTIVOS_API_URL:http://localhost:8080/api/festivos}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
